name: Validate and deploy Cloudflare Pages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# A indexação só pode ser habilitada num push aprovado para a main,
# para o beta aprovado; prévias continuam sem indexação.
env:
  CATALOG_SITE_URL: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'https://ceu-de-lavanda.pages.dev' || '' }}
  CATALOG_INDEXABLE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'true' || 'false' }}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium --only-shell
      - run: pnpm test:e2e
      - name: Check approved Playwright golden screenshots
        run: pnpm test:visual:regression
      - name: Report image asset sizes
        run: node scripts/audit-assets.mjs
      - name: Collect Lighthouse CI baseline
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=.lighthouserc.cjs
      - name: Verify Cloudflare Pages routing via Wrangler (local)
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.151.1 pages dev out --port 8788 > /tmp/wrangler-pages.log 2>&1 &
          pages_pid=$!
          trap 'kill "$pages_pid" 2>/dev/null || true' EXIT
          node scripts/verify-cloudflare-pages.mjs http://127.0.0.1:8788 local || { cat /tmp/wrangler-pages.log; exit 1; }
      - name: Deploy and verify isolated Cloudflare Pages PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN obrigatório para testar a prévia real}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID obrigatório para testar a prévia real}"
          output=$(pnpm dlx wrangler@4.151.1 pages deploy out --project-name ceu-de-lavanda --branch "quality-pr-${{ github.event.pull_request.number }}" 2>&1)
          printf '%s\n' "$output"
          preview=$(printf '%s\n' "$output" | grep -Eo 'https://[a-z0-9-]+\.ceu-de-lavanda\.pages\.dev' | head -n 1)
          test -n "$preview" || { echo "URL da prévia não localizada"; exit 1; }
          echo "CF_PREVIEW_URL=$preview" >> "$GITHUB_ENV"
          node scripts/verify-cloudflare-pages.mjs "$preview" preview
      - name: Lighthouse on Cloudflare Pages PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=.lighthouserc.cloudflare.cjs
      - name: Summarize Lighthouse payload and Web Vitals
        if: always()
        run: node scripts/summarize-lighthouse.mjs
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_id }}
          path: |
            artifacts/lighthouse/
            artifacts/lighthouse-cloudflare/
            artifacts/quality/
            artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 7

      - name: Deploy production site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm dlx wrangler@4.151.1 pages deploy out --project-name ceu-de-lavanda --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy preview site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: pnpm dlx wrangler@4.151.1 pages deploy out --project-name ceu-de-lavanda --branch develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
