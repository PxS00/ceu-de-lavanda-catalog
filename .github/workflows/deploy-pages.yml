name: Validate and deploy Cloudflare Pages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# A indexação só pode ser habilitada num push aprovado para a main,
# com as duas GitHub Actions Variables preenchidas deliberadamente.
env:
  CATALOG_SITE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CATALOG_SITE_URL || '' }}
  CATALOG_INDEXABLE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CATALOG_INDEXABLE || 'false' }}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Report image asset sizes
        run: node scripts/audit-assets.mjs
      - name: Collect Lighthouse CI baseline
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=.lighthouserc.cjs
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_id }}
          path: |
            artifacts/lighthouse/
            artifacts/quality/
            artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 7

      - name: Deploy production site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm dlx wrangler@4.151.1 pages deploy out --project-name ceu-de-lavanda --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy preview site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: pnpm dlx wrangler@4.151.1 pages deploy out --project-name ceu-de-lavanda --branch develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
