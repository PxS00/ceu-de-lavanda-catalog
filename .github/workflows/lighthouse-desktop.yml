name: Lighthouse desktop baseline (manual)

# Desktop audits are explicit, to avoid multiplying Lighthouse runs on every PR push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Measure three desktop runs per route
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=.lighthouserc.desktop.cjs
      - name: Upload desktop Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-desktop-${{ github.run_id }}
          path: artifacts/lighthouse-desktop/
          retention-days: 7
          if-no-files-found: warn
